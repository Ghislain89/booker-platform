# OpenAPI definitions for the Booker API, loaded by src/config/swagger.ts.
# Keep this file in sync with src/routes/*.ts, then run `npm run swagger:export`.

components:
  responses:
    BadRequest:
      description: Validation failed. `details` maps each invalid field to a message.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
    Unauthorized:
      description: No token was sent.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The token is invalid or expired, or the user may not access this resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema:
        type: string
  schemas:
    Error:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
    ValidationError:
      type: object
      required: [success, error, details]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: Validation failed
        details:
          type: object
          additionalProperties:
            type: string
          example:
            checkIn: checkIn must not be in the past
    SuccessMessage:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string
    User:
      type: object
      required: [id, username, email, role, avatarUrl, createdAt, updatedAt]
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [ROLE_USER, ROLE_ADMIN]
        avatarUrl:
          type: string
          nullable: true
          example: /uploads/1791552967476-f9qq9yoh.png
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UserSummary:
      type: object
      required: [id, username, email]
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
    UserResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/User"
    RoomResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/Room"
    AuthResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: object
          required: [token, user]
          properties:
            token:
              type: string
            user:
              $ref: "#/components/schemas/User"
    Room:
      type: object
      required: [id, number, type, price, capacity, amenities, status, featured, imageUrl, position, createdAt, updatedAt]
      properties:
        id:
          type: string
        number:
          type: string
          example: "101"
        type:
          type: string
          enum: [STANDARD, DELUXE, SUITE]
        price:
          type: number
          description: Price per night
          example: 100
        capacity:
          type: integer
          example: 2
        amenities:
          type: array
          items:
            type: string
          example: [WiFi, TV]
        status:
          type: string
          enum: [AVAILABLE, OCCUPIED, MAINTENANCE]
        featured:
          type: boolean
          description: Shown on the home page
        imageUrl:
          type: string
          nullable: true
          description: Photo uploaded with `POST /api/rooms/{id}/image`
        position:
          type: integer
          description: Order in the admin room list; set with `PUT /api/rooms/order`
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PublicRoom:
      allOf:
        - $ref: "#/components/schemas/Room"
        - type: object
          required: [bookedPeriods]
          properties:
            bookedPeriods:
              type: array
              description: Pending and confirmed bookings that have not ended yet
              items:
                type: object
                required: [checkIn, checkOut]
                properties:
                  checkIn:
                    type: string
                    format: date-time
                  checkOut:
                    type: string
                    format: date-time
    PageMeta:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 6
        total:
          type: integer
          example: 12
        totalPages:
          type: integer
          example: 2
    Extra:
      type: string
      enum: [BREAKFAST, PARKING, LATE_CHECKOUT]
      description: "Breakfast: € 15 per guest per night · Parking: € 12 per night · Late check-out: € 25 per stay"
    RoomInput:
      type: object
      properties:
        number:
          type: string
          maxLength: 20
          example: "105"
        type:
          type: string
          enum: [STANDARD, DELUXE, SUITE]
        price:
          type: number
          minimum: 0
          example: 120
        capacity:
          type: integer
          minimum: 1
          maximum: 10
          example: 2
        amenities:
          type: array
          items:
            type: string
          example: [WiFi, TV]
        status:
          type: string
          enum: [AVAILABLE, OCCUPIED, MAINTENANCE]
        featured:
          type: boolean
    Booking:
      type: object
      required: [id, userId, roomId, checkIn, checkOut, status, adults, children, extras, nights, totalPrice, createdAt, updatedAt]
      properties:
        id:
          type: string
        userId:
          type: string
        roomId:
          type: string
        checkIn:
          type: string
          format: date-time
        checkOut:
          type: string
          format: date-time
        status:
          type: string
          enum: [PENDING, CONFIRMED, CANCELLED, COMPLETED]
        adults:
          type: integer
          example: 2
        children:
          type: integer
          example: 0
        extras:
          type: array
          items:
            $ref: "#/components/schemas/Extra"
        nights:
          type: integer
          description: Computed from checkIn and checkOut
          example: 3
        totalPrice:
          type: number
          description: Computed; nights × room price + extras
          example: 285
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/UserSummary"
        room:
          $ref: "#/components/schemas/Room"
    Message:
      type: object
      required: [id, userId, name, email, subject, content, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        userId:
          type: string
          nullable: true
          description: "`null` for messages sent with the public contact form"
        name:
          type: string
          nullable: true
          description: Contact form only
        email:
          type: string
          nullable: true
          description: Contact form only
        subject:
          type: string
        content:
          type: string
        status:
          type: string
          enum: [UNREAD, READ, ARCHIVED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        user:
          allOf:
            - $ref: "#/components/schemas/UserSummary"
          nullable: true
    Report:
      type: object
      required: [id, type, data, period, generatedAt]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [OCCUPANCY, REVENUE, CUSTOMER_SATISFACTION]
        data:
          type: object
          additionalProperties: true
          description: Report figures; the shape depends on the report type.
        period:
          type: object
          required: [start, end]
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
        generatedAt:
          type: string
          format: date-time
    BrandingContact:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        address:
          type: string
          maxLength: 200
        phone:
          type: string
          maxLength: 50
        email:
          type: string
          maxLength: 254
    BrandingMap:
      type: object
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
    BrandingTheme:
      type: object
      properties:
        primaryColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          example: "#2E7D32"
        secondaryColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          example: "#D84315"
    Branding:
      type: object
      required: [id, name, logoUrl, description, contact, map, theme, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        logoUrl:
          type: string
        description:
          type: string
        contact:
          $ref: "#/components/schemas/BrandingContact"
        map:
          $ref: "#/components/schemas/BrandingMap"
        theme:
          $ref: "#/components/schemas/BrandingTheme"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PublicBranding:
      type: object
      required: [name, logoUrl, description, contact, map, theme]
      properties:
        name:
          type: string
        logoUrl:
          type: string
        description:
          type: string
        contact:
          $ref: "#/components/schemas/BrandingContact"
        map:
          $ref: "#/components/schemas/BrandingMap"
        theme:
          $ref: "#/components/schemas/BrandingTheme"
    BrandingInput:
      type: object
      description: Every field is optional; nested objects are merged with the current branding.
      properties:
        name:
          type: string
          maxLength: 100
        logoUrl:
          type: string
          maxLength: 500
        description:
          type: string
          maxLength: 1000
        contact:
          $ref: "#/components/schemas/BrandingContact"
        map:
          $ref: "#/components/schemas/BrandingMap"
        theme:
          $ref: "#/components/schemas/BrandingTheme"

tags:
  - name: Public
    description: No token needed; used by the web UI
  - name: Auth
  - name: Rooms
  - name: Bookings
  - name: Messages
  - name: Reports
    description: Admin only
  - name: Branding
  - name: Events
    description: Live updates for the web UI (Server-Sent Events)

paths:
  /api/public/rooms:
    get:
      summary: Search rooms (no token needed)
      description: |
        Filters can be combined. Passing `checkIn` and `checkOut` only returns rooms that are available
        for the whole period (not in maintenance, no overlapping pending or confirmed booking).
      tags: [Public]
      security: []
      parameters:
        - in: query
          name: type
          description: One or more room types, comma separated or repeated
          schema:
            type: array
            items:
              type: string
              enum: [STANDARD, DELUXE, SUITE]
          style: form
          explode: false
        - in: query
          name: minPrice
          schema:
            type: number
            minimum: 0
        - in: query
          name: maxPrice
          schema:
            type: number
            minimum: 0
        - in: query
          name: capacity
          description: Minimum number of guests
          schema:
            type: integer
            minimum: 1
        - in: query
          name: featured
          schema:
            type: boolean
        - in: query
          name: checkIn
          schema:
            type: string
            format: date
          example: "2030-06-01"
        - in: query
          name: checkOut
          schema:
            type: string
            format: date
          example: "2030-06-03"
        - in: query
          name: sort
          schema:
            type: string
            enum: [number, price, -price, capacity, -capacity]
            default: number
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 6
      responses:
        "200":
          description: One page of rooms
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Room"
                  meta:
                    $ref: "#/components/schemas/PageMeta"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/public/rooms/{id}:
    get:
      summary: Get a room by id or room number (no token needed)
      tags: [Public]
      security: []
      parameters:
        - in: path
          name: id
          required: true
          description: Room id or room number, for example `101`
          schema:
            type: string
      responses:
        "200":
          description: The room and the periods it is booked
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/PublicRoom"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/public/branding:
    get:
      summary: Get the hotel branding (no token needed)
      tags: [Public]
      security: []
      responses:
        "200":
          description: The branding
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/PublicBranding"

  /api/public/messages:
    post:
      summary: Send a message with the contact form (no token needed)
      tags: [Public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, subject, content]
              properties:
                name:
                  type: string
                  maxLength: 100
                  example: Sam Visitor
                email:
                  type: string
                  format: email
                  example: sam@example.com
                subject:
                  type: string
                  maxLength: 200
                  example: Group booking
                content:
                  type: string
                  maxLength: 5000
                  example: Do you offer discounts for groups of ten?
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/public/flags:
    get:
      summary: Trainer flags that apply to this request
      description: Runtime flags plus the `x-booker-flags` request header. Always empty when the test API is off. The web UI reads them on start-up.
      tags: [Public]
      security: []
      responses:
        "200":
          description: Enabled flags
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [enabled]
                    properties:
                      enabled:
                        type: array
                        items:
                          type: string
                        example: [popup-cookie]

  /api/events:
    get:
      summary: Live updates (Server-Sent Events)
      description: |
        A `text/event-stream` that stays open. `EventSource` cannot send headers, so pass the token as `?token=`
        (an `Authorization` header works too). Events:

        - `ready`: sent once after connecting
        - `booking.created`, `booking.updated`: `{ id, status, roomNumber, checkIn, checkOut, username }`; sent to the guest of the booking and to admins
        - `message.created`: `{ id, subject, from }`; admins only
      tags: [Events]
      security: []
      parameters:
        - in: query
          name: token
          schema:
            type: string
          description: JWT from `/api/auth/login`
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
                example: "event: booking.updated\ndata: {\"id\":\"seed-booking-6\",\"status\":\"CONFIRMED\"}\n\n"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/auth/login:
    post:
      summary: Log in
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  example: password123
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/register:
    post:
      summary: Register a new user
      description: New users always get ROLE_USER. The response contains a token, so the user is logged in straight away.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 50
                  pattern: "^[A-Za-z0-9_.-]+$"
                  example: newuser
                email:
                  type: string
                  format: email
                  example: newuser@example.com
                password:
                  type: string
                  minLength: 8
                  maxLength: 100
                  example: password123
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: "`Username already exists` or `Email already exists`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/logout:
    post:
      summary: Log out
      description: Tokens are stateless JWTs, so logging out only tells the client to forget its token.
      tags: [Auth]
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean

  /api/auth/me:
    get:
      summary: Get your profile
      tags: [Auth]
      responses:
        "200":
          description: The logged-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      summary: Change your e-mail address
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: new-address@example.com
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/me/avatar:
    post:
      summary: Upload your avatar
      description: PNG, JPEG, GIF or WebP; at most 2 MB. Replaces the previous avatar.
      tags: [Auth]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        "200":
          description: Avatar saved; `avatarUrl` points to the image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/rooms:
    get:
      summary: List all rooms
      description: Sorted by room number.
      tags: [Rooms]
      responses:
        "200":
          description: All rooms
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Create a room (admin only)
      tags: [Rooms]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/RoomInput"
                - type: object
                  required: [number, type, price, capacity]
      responses:
        "201":
          description: Room created
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Room"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A room with this number already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/rooms/order:
    put:
      summary: Save the room order (admin only)
      description: Used by drag and drop in the admin room list. Rooms get positions 1..n in the given order.
      tags: [Rooms]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roomIds]
              properties:
                roomIds:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: All rooms, in the new order
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Room"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/rooms/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      summary: Get a room
      tags: [Rooms]
      responses:
        "200":
          description: The room
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Update a room (admin only)
      description: Partial update; only the fields you send are changed.
      tags: [Rooms]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomInput"
      responses:
        "200":
          description: Room updated
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Room"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Another room already has this number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete a room (admin only)
      tags: [Rooms]
      responses:
        "200":
          description: "`Room deleted successfully`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"
        "401":
