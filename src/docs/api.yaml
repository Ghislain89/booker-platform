  /api/bookings:
    get:
      summary: List all bookings (admin only)
      tags: [Bookings]
      responses:
        "200":
          description: All bookings, sorted by check-in date
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Book a room
      description: |
        Creates a PENDING booking for the logged-in user.
        - `checkIn` may not be in the past and `checkOut` must be after `checkIn` (400).
        - The room must exist (404) and not be in MAINTENANCE (409).
        - The dates may not overlap a PENDING or CONFIRMED booking for the same room (409 `Room not available`).
          Checking out on the day the next guest checks in is fine.
        - `adults` (default 1) + `children` (default 0) may not exceed the room capacity (400, `details.guests`).
        - `nights` and `totalPrice` are computed by the server.
      tags: [Bookings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roomId, checkIn, checkOut]
              properties:
                roomId:
                  type: string
                checkIn:
                  type: string
                  format: date-time
                  example: "2030-04-01T00:00:00.000Z"
                checkOut:
                  type: string
                  format: date-time
                  example: "2030-04-05T00:00:00.000Z"
                adults:
                  type: integer
                  minimum: 1
                  maximum: 10
                  default: 1
                children:
                  type: integer
                  minimum: 0
                  maximum: 10
                  default: 0
                extras:
                  type: array
                  items:
                    $ref: "#/components/schemas/Extra"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Room not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The room is under maintenance or not available for these dates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

