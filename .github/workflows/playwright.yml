name: Playwright Tests
on:
  push:
    branches: [main, solutions]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Check swagger.json is up to date
        run: npm run swagger:export && git diff --exit-code playwright/support/zod/swagger.json
      - name: Set up database
        run: npm run setup
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  docker:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t booker .
      - name: Start container
        run: docker run -d --name booker -p 3000:3000 booker
      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            curl -fs http://localhost:3000/health && exit 0
            sleep 2
          done
          docker logs booker
          exit 1
      - name: Smoke test
        run: |
          curl -fs http://localhost:3000/ | grep -q '<div id="root">'
          curl -fs http://localhost:3000/api/public/rooms | grep -q '"success":true'
          curl -fs -X POST http://localhost:3000/api/testing/reset | grep -q '"success":true'
      - name: Container logs
        if: ${{ failure() }}
        run: docker logs booker
